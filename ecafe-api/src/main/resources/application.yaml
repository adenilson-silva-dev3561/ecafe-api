spring:
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

  application:
    name: ecafe-api

  datasource:
    url: jdbc:postgresql://172.18.70.30:5432/ecafe
    username: postgres
    password: 356132

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: true

  jackson:
    default-property-inclusion: non_null

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/ecafe

server:
  port: 8080

logging:
  level:
    eCafe.API: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}

  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger
    operations-sorter: method
    tags-sorter: alpha

  api-docs:
    path: /api-docs

keycloak:
  server-url: http://172.18.70.30:8081/
  realm: ecafe
  admin:
    client-id: ecafe-api
    client-secret: i0pvtPKigzgKRTYAXGfkwZoQXT0YUjqq